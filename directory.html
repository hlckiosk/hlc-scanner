<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLC Member Directory</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a1a1a; min-height: 100vh; }

/* LOGIN */
#loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.login-card { background: white; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); text-align: center; }
.login-card img { max-width: 200px; margin-bottom: 24px; }
.login-card h1 { font-size: 22px; color: #0d2b5e; margin-bottom: 6px; }
.login-card p { font-size: 14px; color: #64748b; margin-bottom: 24px; }
.login-card input { width: 100%; padding: 13px 16px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px; outline: none; }
.login-card input:focus { border-color: #1565C0; }
.login-card button { width: 100%; padding: 13px; background: #0d2b5e; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
.login-card button:hover { background: #1565C0; }
.login-err { color: #c62828; font-size: 13px; margin-top: 8px; min-height: 20px; }

/* DIRECTORY */
#dirScreen { display: none; }
.top-bar { background: #0d2b5e; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.top-bar img { max-width: 140px; }
.top-bar-right { display: flex; align-items: center; gap: 12px; }
.logout-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 7px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.logout-btn:hover { background: rgba(255,255,255,0.25); }

.search-bar { background: white; padding: 20px 24px; border-bottom: 1px solid #e2e8f0; }
.search-wrap { max-width: 900px; margin: 0 auto; }
.search-input { width: 100%; padding: 12px 16px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 10px; outline: none; margin-bottom: 12px; }
.search-input:focus { border-color: #1565C0; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-label { font-size: 13px; color: #64748b; font-weight: 600; }
.filter-btn { padding: 6px 14px; border-radius: 99px; border: 1.5px solid #cbd5e1; background: white; font-size: 13px; cursor: pointer; color: #475569; font-weight: 500; }
.filter-btn:hover { border-color: #0d2b5e; color: #0d2b5e; }
.filter-btn.active { background: #0d2b5e; color: white; border-color: #0d2b5e; }
.filter-btn.clear-btn { border-color: #94a3b8; color: #94a3b8; }
.filter-btn.clear-btn:hover { border-color: #c62828; color: #c62828; }

.results-info { max-width: 900px; margin: 16px auto 0; padding: 0 24px; font-size: 13px; color: #64748b; }

.cards { max-width: 900px; margin: 0 auto; padding: 20px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

.member-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 18px 20px; transition: box-shadow 0.15s; }
.member-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
.card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #f0f4f8; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: #e8f0fe; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #0d2b5e; flex-shrink: 0; }
.card-name { font-size: 15px; font-weight: 700; color: #0d2b5e; line-height: 1.3; }
.card-id { font-size: 12px; color: #94a3b8; margin-top: 2px; }
.card-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; font-size: 13px; }
.card-row-label { color: #94a3b8; min-width: 70px; flex-shrink: 0; font-size: 12px; }
.card-row-val { color: #334155; word-break: break-word; }
.interest-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f4f8; }
.tag { display: inline-block; background: #e8f0fe; color: #1565C0; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
.dep-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f4f8; font-size: 12px; color: #64748b; }
.dep-section strong { color: #475569; display: block; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.dep-item { color: #334155; font-size: 13px; }

.empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
.empty h3 { font-size: 18px; margin-bottom: 8px; }
.loading { text-align: center; padding: 60px 20px; color: #64748b; }
.loading-spin { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #0d2b5e; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
#errMsg { max-width: 900px; margin: 20px auto; padding: 0 24px; }
.err-box { background: #fee2e2; color: #c62828; padding: 12px 16px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <img src="https://i.imgur.com/iexv8G2.png" alt="High Lane Club" />
    <h1>Member Directory</h1>
    <p>Enter your member password to access the directory.</p>
    <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" />
    <div class="login-err" id="pwErr"></div>
    <button onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- DIRECTORY -->
<div id="dirScreen">
  <div class="top-bar">
    <img src="https://i.imgur.com/iexv8G2.png" alt="High Lane Club" />
    <div class="top-bar-right">
      <span style="color:rgba(255,255,255,0.7);font-size:13px;">Member Directory</span>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <div class="search-bar">
    <div class="search-wrap">
      <input type="text" id="searchBox" class="search-input" placeholder="Search by name, town, occupation, employer, or dependent..." oninput="renderCards()" />
      <div class="filter-row">
        <span class="filter-label">Interests:</span>
        <button class="filter-btn" data-interest="Pool" onclick="toggleFilter(this)">Pool</button>
        <button class="filter-btn" data-interest="Tennis" onclick="toggleFilter(this)">Tennis</button>
        <button class="filter-btn" data-interest="Bowling" onclick="toggleFilter(this)">Bowling</button>
        <button class="filter-btn" data-interest="Pickleball" onclick="toggleFilter(this)">Pickleball</button>
        <button class="filter-btn" data-interest="Events" onclick="toggleFilter(this)">Events</button>
        <button class="filter-btn clear-btn" onclick="clearFilters()">Clear filters</button>
      </div>
    </div>
  </div>

  <div class="results-info" id="resultsInfo"></div>
  <div id="errMsg"></div>

  <div class="cards" id="cardsWrap">
    <div class="loading" style="grid-column:1/-1;">
      <div class="loading-spin"></div>
      <p>Loading member directory...</p>
    </div>
  </div>
</div>

<script>
var PASS      = 'HLCMembership2026';
var API_URL   = 'https://script.google.com/macros/s/AKfycbyhfL9HqO08sd5lwMWImuENbBENLmAHcULYurQgCtK_cjcv0grTwUK7tkUVsB_LzdaF/exec';
var allMembers = [];
var activeFilters = [];

// ── Column indices in PublicMemberList (0-based, after header row) ──
// Member ID | Member 1 Name | Street Address | Town | M1 Email | M1 Phone |
// M1 Occupation | M1 Place of Employment | M1 Occ Phone |
// Member 2 Name | M2 Email | M2 Phone | M2 Occupation | M2 Place of Employment | M2 Occ Phone |
// Dependents | Pool | Tennis | Bowling | Pickleball | Events | Last Updated
var C = {
  id:        0,
  m1name:    1,
  street:    2,
  town:      3,
  m1email:   4,
  m1phone:   5,
  m1occ:     6,
  m1place:   7,
  m1occph:   8,
  m2name:    9,
  m2email:   10,
  m2phone:   11,
  m2occ:     12,
  m2place:   13,
  m2occph:   14,
  deps:      15,
  pool:      16,
  tennis:    17,
  bowling:   18,
  pickle:    19,
  events:    20,
  updated:   21
};

function doLogin() {
  var pw = document.getElementById('pw').value.trim();
  if (pw === PASS) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dirScreen').style.display  = 'block';
    document.getElementById('pwErr').textContent = '';
    loadDirectory();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password. Please try again.';
    document.getElementById('pw').value = '';
  }
}

function doLogout() {
  document.getElementById('dirScreen').style.display  = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pw').value = '';
  allMembers = [];
}

function loadDirectory() {
  jsonp(API_URL + '?action=directory&callback=gotDirectory');
  setTimeout(function() {
    if (!allMembers.length) {
      document.getElementById('errMsg').innerHTML =
        '<div class="err-box">Could not load directory. Check your Apps Script deployment.</div>';
      document.getElementById('cardsWrap').innerHTML = '';
    }
  }, 12000);
}

function gotDirectory(data) {
  document.getElementById('errMsg').innerHTML = '';
  if (!data || !data.rows) {
    document.getElementById('cardsWrap').innerHTML =
      '<div class="empty" style="grid-column:1/-1;"><h3>No data returned</h3><p>Make sure the Apps Script has a directory action.</p></div>';
    return;
  }
  allMembers = data.rows.filter(function(r) { return r[C.m1name] || r[C.m2name]; });
  renderCards();
}

function toggleFilter(btn) {
  var interest = btn.dataset.interest;
  var idx = activeFilters.indexOf(interest);
  if (idx > -1) {
    activeFilters.splice(idx, 1);
    btn.classList.remove('active');
  } else {
    activeFilters.push(interest);
    btn.classList.add('active');
  }
  renderCards();
}

function clearFilters() {
  activeFilters = [];
  document.querySelectorAll('.filter-btn[data-interest]').forEach(function(b) {
    b.classList.remove('active');
  });
  document.getElementById('searchBox').value = '';
  renderCards();
}

function renderCards() {
  var q    = (document.getElementById('searchBox').value || '').toLowerCase().trim();
  var wrap = document.getElementById('cardsWrap');

  var filtered = allMembers.filter(function(r) {
    // Interest filters
    if (activeFilters.length) {
      var hasAll = activeFilters.every(function(f) {
        if (f === 'Pool')       return r[C.pool]    === 'Yes';
        if (f === 'Tennis')     return r[C.tennis]  === 'Yes';
        if (f === 'Bowling')    return r[C.bowling] === 'Yes';
        if (f === 'Pickleball') return r[C.pickle]  === 'Yes';
        if (f === 'Events')     return r[C.events]  === 'Yes';
        return false;
      });
      if (!hasAll) return false;
    }
    // Text search
    if (q) {
      var haystack = [
        r[C.m1name], r[C.m2name], r[C.town], r[C.street],
        r[C.m1occ],  r[C.m1place], r[C.m2occ], r[C.m2place],
        r[C.m1email], r[C.m2email],
        r[C.deps]  // includes dependent names + birth years
      ].join(' ').toLowerCase();
      if (haystack.indexOf(q) === -1) return false;
    }
    return true;
  });

  document.getElementById('resultsInfo').textContent =
    filtered.length + ' of ' + allMembers.length + ' member' + (allMembers.length !== 1 ? 's' : '');

  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty" style="grid-column:1/-1;"><h3>No members found</h3><p>Try a different search or clear filters.</p></div>';
    return;
  }

  wrap.innerHTML = filtered.map(function(r) {
    var name     = r[C.m1name] || r[C.m2name] || 'Member';
    var initials = name.split(' ').map(function(p) { return p[0]; }).slice(0,2).join('').toUpperCase();
    var location = [r[C.street], r[C.town]].filter(Boolean).join(', ');

    var tags = [];
    if (r[C.pool]    === 'Yes') tags.push('Pool');
    if (r[C.tennis]  === 'Yes') tags.push('Tennis');
    if (r[C.bowling] === 'Yes') tags.push('Bowling');
    if (r[C.pickle]  === 'Yes') tags.push('Pickleball');
    if (r[C.events]  === 'Yes') tags.push('Events');

    var m2section = '';
    if (r[C.m2name]) {
      m2section = '<div style="margin-top:10px;padding-top:10px;border-top:1px solid #f0f4f8;">' +
        '<div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Member 2</div>' +
        row('Name', r[C.m2name]) +
        row('Email', r[C.m2email]) +
        row('Phone', r[C.m2phone]) +
        row('Occupation', r[C.m2occ]) +
        row('Employer', r[C.m2place]) +
      '</div>';
    }

    var depSection = '';
    if (r[C.deps]) {
      var deps = r[C.deps].split(',').map(function(d) { return d.trim(); }).filter(Boolean);
      depSection = '<div class="dep-section"><strong>Dependents</strong>' +
        deps.map(function(d) { return '<div class="dep-item">' + d + '</div>'; }).join('') +
      '</div>';
    }

    var tagsHtml = tags.length ? '<div class="interest-tags">' +
      tags.map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('') +
    '</div>' : '';

    return '<div class="member-card">' +
      '<div class="card-header">' +
        '<div class="avatar">' + initials + '</div>' +
        '<div><div class="card-name">' + name + '</div>' +
        '<div class="card-id">ID: ' + r[C.id] + '</div></div>' +
      '</div>' +
      row('Address', location) +
      row('Email', r[C.m1email]) +
      row('Phone', r[C.m1phone]) +
      row('Occupation', r[C.m1occ]) +
      row('Employer', r[C.m1place]) +
      m2section +
      depSection +
      tagsHtml +
    '</div>';
  }).join('');
}

function row(label, val) {
  if (!val) return '';
  return '<div class="card-row"><span class="card-row-label">' + label + '</span>' +
    '<span class="card-row-val">' + val + '</span></div>';
}

var _jTimer = null;
function jsonp(url) {
  var old = document.getElementById('_jdir');
  if (old) old.parentNode.removeChild(old);
  if (_jTimer) clearTimeout(_jTimer);
  var s = document.createElement('script');
  s.id  = '_jdir';
  s.src = url;
  document.body.appendChild(s);
}
</script>
</body>
</html>
